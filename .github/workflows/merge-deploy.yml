name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      failure_action:
        description: 'Action to take when CI fails'
        required: true
        type: choice
        default: comments
        options:
          - comments
          - issues
          - jules
concurrency:
  group: ${{ github.workflow }}-${{ github.event }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    uses: ./.github/workflows/lint.yml

  test:
    uses: ./.github/workflows/test.yml

  comment-request:
    needs: [lint, test]
    if: failure() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/comment-request.yml
    with:
      error_log_lint: ${{ needs.lint.outputs.error_log }}
      error_log_test: ${{ needs.test.outputs.error_log }}

  issue-request:
    needs: [lint, test]
    if: failure() && github.event_name == 'workflow_dispatch' && inputs.failure_action == 'issues'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/issue-request.yml
    with:
      error_log_lint: ${{ needs.lint.outputs.error_log }}
      error_log_test: ${{ needs.test.outputs.error_log }}

  jules-request:
    needs: [lint, test]
    if: failure() && github.event_name == 'workflow_dispatch' && inputs.failure_action == 'jules' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/jules-request.yml
    secrets: inherit
    with:
      error_log_lint: ${{ needs.lint.outputs.error_log }}
      error_log_test: ${{ needs.test.outputs.error_log }}

  build:
    needs: [lint, test]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/build.yml
    with:
      environment: PROD
    secrets:
      SECRET_TOKEN: ${{ secrets.SECRET_TOKEN }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}

  deploy:
    needs: [build]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: PROD
      VersionCode: ${{ needs.build.outputs.VersionCode }}
      VersionName: ${{ needs.build.outputs.VersionName }}
      CleanVersion: ${{ needs.build.outputs.CleanVersion }}
    secrets:
      GOOGLE_PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}

  createtag:
    needs: [deploy]
    uses: ./.github/workflows/createtag.yml
