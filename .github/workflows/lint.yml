name: Lint Workflow
on:
  workflow_call:
    outputs:
      error_log:
        description: "Lint error log"
        value: ${{ jobs.lint.outputs.error_log }}

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    outputs:
      error_log: ${{ steps.error_log.outputs.log_content }}
    steps:

      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Lint
        id: run_lint
        run: |
          set -o pipefail
          ./gradlew lintDebug -x :about-module:lintDebug -x :about-module:checkDebugAarMetadata -x :about-module:bundleDebugLocalLintAar -x :about-module:generateDebugUnitTestLintModel --no-daemon --no-parallel --stacktrace | tee build_errors.log

      - name: Read Error Log
        if: failure()
        id: error_log
        run: |
          if [ -f build_errors.log ]; then
            ERROR_CONTENT=$(tail -n 50 build_errors.log)
          else
            ERROR_CONTENT="No build_errors.log file found."
          fi
          echo "log_content<<EOF" >> "$GITHUB_OUTPUT"
          echo "$ERROR_CONTENT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path:  |
                ./app/build/reports/
                ./build/reports
                ./japl-android-about-module/build/reports
                ./ui/build/intermediates/lint_intermediate_text_report/debug
                ./japl-android-finances-services/build/reports
                ./model/build/reports
                ./japl-android-graphs/build/reports
                ./japl-finances-iport/build/reports
                ./japl-android-finances-core/build/reports
                ./japl-android-finances-paid-module/build/reports
                ./japl-android-finances-inputs/build/reports
                ./credit/build/reports
                ./CreditCardModule/build/reports
