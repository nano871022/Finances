name: Lint Workflow
on:
  workflow_call:

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Lint
        id: run_lint
        run: |
          set -o pipefail
          ./gradlew lintDebug -x :about:lintDebug --no-daemon --no-parallel --stacktrace | tee build_errors.log

      - name: Read Error Log
        if: failure()
        id: error_log
        run: |
          ERROR_CONTENT=$(tail -n 50 build_errors.log)
          echo "log_content<<EOF" >> $GITHUB_ENV
          echo "$ERROR_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Request Jules Fix
        if: failure()
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The CI pipeline failed during the lint/test phase.
            Please analyze the following error logs and apply a fix to the repository:
            ${{ env.log_content }}

      - name: Upload Lint Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path:  |
                ./app/build/reports/
                ./build/reports
                ./japl-android-about-module/build/reports
                ./ui/build/intermediates/lint_intermediate_text_report/debug
                ./japl-android-finances-services/build/reports
                ./model/build/reports
                ./japl-android-graphs/build/reports
                ./japl-finances-iport/build/reports
                ./japl-android-finances-core/build/reports
                ./japl-android-finances-paid-module/build/reports
                ./japl-android-finances-inputs/build/reports
                ./credit/build/reports
                ./CreditCardModule/build/reports
