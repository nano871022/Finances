name: Test Workflow
on:
  workflow_call:

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v4
      
      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Unit Tests
        id: run_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --no-parallel --stacktrace | tee build_errors.log

      - name: Read Error Log
        if: failure()
        id: error_log
        run: |
          ERROR_CONTENT=$(tail -n 50 build_errors.log)
          echo "log_content<<EOF" >> $GITHUB_ENV
          echo "$ERROR_CONTENT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Request Jules Fix
        if: failure()
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The CI pipeline failed during the lint/test phase.
            Please analyze the following error logs and apply a fix to the repository:
            ${{ env.log_content }}
          jules_api_key: ${{ secrets.API_KEY_JULES }}

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest/
